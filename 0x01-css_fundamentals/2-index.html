<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Box Model Demo</title>
  <link rel="stylesheet" href="../0x01-css_fundamentals/2-styles.css">
</head>
<body>
  <h1>CSS Box Model Demonstration</h1>

  <section>
    <h2>Without box-sizing: border-box</h2>
    <div class="box no-border-box">Content Box</div>
  </section>

  <section>
    <h2>With box-sizing: border-box</h2>
    <div class="box border-box">Border-Box</div>
  </section>

  <section>
    <h2>Border Styles</h2>
    <div class="box solid-border">Solid Border</div>
    <div class="box dashed-border">Dashed Border</div>
    <div class="box dotted-border">Dotted Border</div>
    <div class="box double-border">Double Border</div>
  </section>

  <section>
    <h2>Border Radius & Box Shadow</h2>
    <div class="box rounded">Rounded Corners</div>
    <div class="box shadow">Box Shadow</div>
  </section>
</body>
</html>
